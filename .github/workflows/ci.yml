name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

  node:
    name: Node.js 24
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # 导入源码后才执行 Node 检查。
      - if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - if: hashFiles('package-lock.json') != ''
        run: |
          npm ci
          npm run check
          npm test
          npm run pack:plugin
      - name: Check the release archive
        if: hashFiles('package-lock.json') != ''
        id: archive
        shell: pwsh
        run: |
          $package = ./scripts/check-release-archive.ps1
          "archive=$($package.Archive)" >> $env:GITHUB_OUTPUT
          "checksum=$($package.Checksum)" >> $env:GITHUB_OUTPUT
          Write-Output "Archive SHA-256: $($package.Sha256)"
      - name: Upload the candidate from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.archive.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.checksum }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
